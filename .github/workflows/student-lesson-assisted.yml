name: Lesson-assisted student comparison

on:
  push:
    branches: [experiment/student-lesson-assisted]
    paths: [.github/workflows/student-lesson-assisted.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: groq-student-baseline
  cancel-in-progress: false

jobs:
  student:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[tokens]'
      - name: Run offline tests
        run: python -m unittest discover -s tests -q
      - name: Restore the baseline bundles and responses
        uses: actions/download-artifact@v4
        with:
          name: student-baseline
          path: runs
          run-id: 42631656348
          github-token: ${{ github.token }}
      - name: Restore the saved Luna lessons
        uses: actions/download-artifact@v4
        with:
          name: luna-teacher-lessons
          path: runs
          run-id: 42643352316
          github-token: ${{ github.token }}
      - name: Restore the lesson-assisted checkpoint
        uses: actions/download-artifact@v4
        with:
          name: student-lesson-assisted
          path: runs
          run-id: 42652195731
          github-token: ${{ github.token }}
      - name: Wait for the reported Groq quota reset
        run: |
          retry_at=$(date -u -d '2026-11-09T16:59:33Z' +%s)
          remaining=$((retry_at - $(date -u +%s)))
          if [ "$remaining" -gt 0 ]; then sleep "$remaining"; fi
      - name: Resume the student with the same lesson prompt
        env:
          STUDENT_API_KEY: ${{ secrets.STUDENT_API_KEY || secrets.GROQ_API_KEY }}
        run: python scripts/cloud_student_lessons.py --resume
      - name: Preserve the student comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-lesson-assisted
          path: |
            runs/student-lesson-assisted
            runs/matched-student-plan
          retention-days: 90
          if-no-files-found: error
