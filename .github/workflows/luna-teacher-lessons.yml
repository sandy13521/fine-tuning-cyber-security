name: Luna teacher scan and lessons

on:
  push:
    branches: [experiment/luna-teacher-lessons]
    paths: [.github/workflows/luna-teacher-lessons.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: luna-teacher-lessons
  cancel-in-progress: false

jobs:
  teacher:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run offline tests
        run: python -m unittest discover -s tests -q
      - name: Restore the two completed scan bundles and frozen plan
        uses: actions/download-artifact@v4
        with:
          name: luna-teacher-lessons
          path: runs
          run-id: 42642884135
          github-token: ${{ github.token }}
      - name: Resume the budgeted scan and synthesize lessons
        env:
          TEACHER_API_KEY: ${{ secrets.TEACHER_API_KEY }}
        run: python scripts/cloud_luna_lessons.py --resume
      - name: Preserve findings, usage, and lessons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-teacher-lessons
          path: |
            runs/luna-teacher
            runs/qwen-plan/full-plan
            runs/qwen-plan/teacher-inventory.json
          retention-days: 90
          if-no-files-found: error
