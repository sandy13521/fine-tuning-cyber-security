name: Check Groq Llama student access

on:
  push:
    branches: [experiment/llama-student-access]
    paths: [.github/workflows/llama-student-access.yml]

permissions: {}

jobs:
  access:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check generative Llama model access
        env:
          STUDENT_API_KEY: ${{ secrets.STUDENT_API_KEY || secrets.GROQ_API_KEY }}
        run: |
          set -eu
          test -n "$STUDENT_API_KEY" || { echo "The student credential is missing"; exit 1; }
          curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $STUDENT_API_KEY" \
            https://api.groq.com/openai/v1/models --output "$RUNNER_TEMP/llama-models.json"
          python - "$RUNNER_TEMP/llama-models.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          models = {m['id']: m for m in json.loads(Path(sys.argv[1]).read_text())['data']}
          candidates = ('llama-3.1-8b-instant', 'llama-3.3-70b-versatile')
          print(json.dumps({'generative_llama': [
              {'model': model, 'listed': model in models, 'active': models.get(model, {}).get('active')}
              for model in candidates
          ]}))
          PY
