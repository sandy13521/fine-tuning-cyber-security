name: Check Groq Llama student access

on:
  push:
    branches: [experiment/llama-student-access]
    paths: [.github/workflows/llama-student-access.yml]

permissions: {}

jobs:
  access:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: List generative Llama models available to the student credential
        env:
          STUDENT_API_KEY: ${{ secrets.STUDENT_API_KEY || secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          candidates = ('llama-3.1-8b-instant', 'llama-3.3-70b-versatile')
          key = os.environ.get('STUDENT_API_KEY')
          if not key:
              raise SystemExit('The student credential is missing')
          request = Request('https://api.groq.com/openai/v1/models',
                            headers={'Authorization': 'Bearer ' + key})
          try:
              with urlopen(request, timeout=20) as response:
                  available = {m['id']: m for m in json.load(response)['data']}
          except HTTPError as error:
              raise SystemExit(f'Groq model listing returned HTTP {error.code}') from None
          print(json.dumps({'generative_llama': [
              {'model': model, 'listed': model in available,
               'active': available.get(model, {}).get('active'),
               'context_window': available.get(model, {}).get('context_window')}
              for model in candidates
          ]}))
          PY
