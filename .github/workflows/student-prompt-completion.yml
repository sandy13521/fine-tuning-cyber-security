name: Complete lesson-assisted GPT-OSS 20B scan

on:
  push:
    branches: [experiment/student-prompt-completion]
    paths: [.github/workflows/student-prompt-completion.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: groq-student-baseline
  cancel-in-progress: false

jobs:
  student:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[tokens]'
      - name: Run offline tests
        run: python -m unittest discover -s tests -q
      - name: Restore frozen baseline
        uses: actions/download-artifact@v4
        with:
          name: student-baseline
          path: runs
          run-id: 42631656348
          github-token: ${{ github.token }}
      - name: Restore teacher lessons
        uses: actions/download-artifact@v4
        with:
          name: luna-teacher-lessons
          path: runs
          run-id: 42643352316
          github-token: ${{ github.token }}
      - name: Restore latest assisted checkpoint
        uses: actions/download-artifact@v4
        with:
          name: student-lesson-assisted
          path: runs
          run-id: 42684177132
          github-token: ${{ github.token }}
      - name: Scan the remaining bundles with the same lesson prompt
        env:
          STUDENT_API_KEY: ${{ secrets.STUDENT_API_KEY || secrets.GROQ_API_KEY }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from cloud_student_lessons import BASELINE, LESSONS, MATCHED_PLAN, OUTPUT, PLAN, StudentQuotaClient, preflight
          from cyber_scan.config import load_config
          from cyber_scan.models import create_client
          from cyber_scan.scan.runner import atomic_json, run_scan

          config = load_config(Path('config.student.yaml'))
          model = config.models['student']
          if (model.model, model.base_url, model.retries) != (
              'openai/gpt-oss-20b', 'https://api.groq.com/openai/v1', 0
          ):
              raise ValueError('Unexpected student model or retry configuration')
          if not os.environ.get(model.api_key_env):
              raise ValueError('Groq credential is missing')

          appendix, comparison = preflight(config, PLAN, BASELINE, LESSONS, MATCHED_PLAN)
          checkpoint = json.loads((OUTPUT / 'summary.json').read_text())
          if (checkpoint['completed_units'], checkpoint['planned_units']) != (5, 27):
              raise ValueError('Unexpected progress in the source checkpoint')

          client = StudentQuotaClient(create_client(model))
          report = run_scan(config, MATCHED_PLAN, OUTPUT, role='student', resume=True,
                            retry_failed=True, max_requests=22, delay_seconds=60,
                            system_appendix=appendix, client=client,
                            progress=lambda event: print(json.dumps(event), flush=True))
          atomic_json(OUTPUT / 'comparison.json', comparison)
          print(json.dumps({name: report[name] for name in (
              'status', 'completed_units', 'planned_units', 'fully_processed_primary_files',
              'planned_primary_files', 'accepted_unique_findings', 'rejected_findings',
              'response_status_counts', 'usage'
          )}), flush=True)
          raise SystemExit(0 if report['status'] == 'completed' else 1)
          PY
      - name: Save reports and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-lesson-assisted
          path: |
            runs/student-lesson-assisted
            runs/matched-student-plan
          retention-days: 90
          if-no-files-found: error
