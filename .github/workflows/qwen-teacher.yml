name: Qwen teacher scan

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Optional prior Qwen teacher run ID with the same frozen plan'
        type: string
        required: false
  push:
    branches: [experiment/qwen-teacher]
    paths: [.github/workflows/qwen-teacher.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: groq-qwen-teacher
  cancel-in-progress: false

jobs:
  teacher:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
    steps:
      - name: Check Groq credential
        env:
          STUDENT_API_KEY: ${{ secrets.STUDENT_API_KEY || secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$STUDENT_API_KEY" ]; then
            echo "::error::The Qwen teacher needs the Groq repository Actions secret."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[tokens]'
      - name: Run offline tests
        run: python -m unittest discover -s tests -q
      - uses: actions/setup-java@v4
        if: ${{ !env.RESUME_RUN_ID }}
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned JADX release
        if: ${{ !env.RESUME_RUN_ID }}
        run: |
          curl --fail --location --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip --output /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
      - name: Freeze related source and check the Groq token allowance
        if: ${{ !env.RESUME_RUN_ID }}
        shell: bash
        run: python scripts/cloud_qwen_teacher.py --jadx /tmp/jadx/bin/jadx | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restore Qwen checkpoints
        if: ${{ env.RESUME_RUN_ID }}
        uses: actions/download-artifact@v4
        with:
          name: qwen-teacher-report
          path: runs
          run-id: ${{ env.RESUME_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Scan with Qwen on Groq
        env:
          STUDENT_API_KEY: ${{ secrets.STUDENT_API_KEY || secrets.GROQ_API_KEY }}
        run: |
          resume=()
          if [ -n "$RESUME_RUN_ID" ]; then
            resume=(--resume --retry-failed)
          fi
          cyber-scan scan --config config.qwen-teacher.yaml --plan runs/qwen-plan/full-plan \
            --output runs/qwen-teacher --role teacher --delay-seconds 60 "${resume[@]}"
      - name: Preserve report and frozen inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-teacher-report
          path: |
            runs/qwen-teacher
            runs/qwen-plan/full-plan
            runs/qwen-plan/budget.json
            runs/qwen-plan/teacher-inventory.json
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
