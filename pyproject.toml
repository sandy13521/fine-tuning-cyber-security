[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-scan"
version = "0.1.0"
description = "Reproducible Android static-analysis experiment harness"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "httpx[socks]>=0.27,<1"]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7,<1"]

[project.scripts]
cyber-scan = "cyber_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
